name: macOS native bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: macos-15  # macos-14 images were retired ("configuration is not supported")
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned uv
        run: curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
      - name: Install Python and locked dependencies
        run: |
          "$HOME/.local/bin/uv" python install 3.12
          "$HOME/.local/bin/uv" sync --project services/control-plane --python 3.12 --extra test --locked
      - name: Verify platform and bootstrap contracts
        env:
          VIDEO_WORKBENCH_AUTOMATION_SCHEDULER_ENABLED: "false"
          VIDEO_WORKBENCH_PUBLIC_TREND_WEB_ENABLED: "false"
        run: |
          "$HOME/.local/bin/uv" run --project services/control-plane pytest \
            services/control-plane/tests/test_runtime_paths.py \
            services/control-plane/tests/test_macos_jianying_discovery.py \
            services/control-plane/tests/test_doctor_cli.py \
            services/control-plane/tests/test_native_script_contract.py \
            services/control-plane/tests/test_repo_bootstrap_contract.py -q
          "$HOME/.local/bin/uv" run --project services/control-plane pytest \
            services/control-plane/tests/test_database_bootstrap.py \
            services/control-plane/tests/test_course_schedules.py \
            services/control-plane/tests/test_course_edit_job_service.py \
            services/control-plane/tests/test_sync_helper_packaging.py -q
          bash -n scripts/bootstrap.sh scripts/start-local.sh scripts/stop-local.sh
          python3 scripts/verify-fresh-clone.py --dry-run
      - name: Sample-cut smoke test (synthetic media, aac_at, OFL caption fonts, QA)
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -hide_banner -filters | grep -E " (ass|subtitles) " || echo "ffmpeg has no libass: render.py uses the Pillow subtitle fallback"
          "$HOME/.local/bin/uv" sync --project tools/sample-cut --python 3.12 --locked
          bash -n tools/cosyvoice/install.sh
          "$HOME/.local/bin/uv" run --project tools/sample-cut python tools/sample-cut/fonts_download.py
          "$HOME/.local/bin/uv" run --project tools/sample-cut python tools/sample-cut/smoke_test.py "$RUNNER_TEMP/sample-cut-smoke"
      - name: Upload smoke frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-cut-smoke-macos
          path: ${{ runner.temp }}/sample-cut-smoke/smoke-frame.png
          if-no-files-found: ignore
