name: macOS full acceptance (CosyVoice + produce)

# A clean Mac does what a new user's Mac would: install local CosyVoice, download fonts and the BGM library,
# then produce a complete video with the local voice and upload it for a listen/look. Synthetic footage only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/cosyvoice/**"
      - "tools/sample-cut/mac_acceptance.py"
      - "tools/sample-cut/produce.py"
      - "tools/sample-cut/narration_from_whole.py"
      - "tools/sample-cut/vw_common.py"
      - "tools/sample-cut/voices.py"
      - "tools/sample-cut/my_bgm.py"
      - "tools/sample-cut/add_bgm.py"
      - ".github/workflows/mac-acceptance.yml"

permissions:
  contents: read

jobs:
  full-acceptance:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Tooling (uv, ffmpeg)
        run: |
          curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
          command -v ffmpeg >/dev/null || brew install ffmpeg
          sysctl -n machdep.cpu.brand_string; df -h "$HOME" | tail -1
      - name: Install local CosyVoice (Hugging Face model source, includes its own smoke test)
        env:
          COSYVOICE_MODEL_SOURCE: huggingface
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          time bash tools/cosyvoice/install.sh
          df -h "$HOME" | tail -1
      - name: Autopilot setup (fonts, BGM library, readiness)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --project tools/sample-cut --python 3.12 --locked
          uv run --project tools/sample-cut python tools/sample-cut/autopilot_setup.py
      - name: Produce a full video with the local voice
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          time uv run --project tools/sample-cut python tools/sample-cut/mac_acceptance.py "$RUNNER_TEMP/acceptance" --voice local
      - name: Upload the finished delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-acceptance-delivery
          path: |
            ${{ runner.temp }}/acceptance/delivery
            ${{ runner.temp }}/acceptance/work/renders/final/qa.json
          if-no-files-found: warn
          retention-days: 14
