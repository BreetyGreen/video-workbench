name: Sync Helper Build
on:
  workflow_dispatch:
  push:
    tags: ['sync-helper-v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File sync-helper/build.ps1
          - os: macos-14
            script: bash sync-helper/build.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: VideoWorkbenchSync-${{ matrix.os }}
          path: sync-helper/dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/sync-helper-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish versioned helper assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --draft --title "VideoWorkbench Sync ${GITHUB_REF_NAME}" --generate-notes
          find release-artifacts -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
