[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "automated-video-dingtalk-connector"
version = "0.1.0"
description = "DingTalk Stream material intake for the automated video workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "dingtalk-stream==0.24.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
video-workbench-dingtalk = "dingtalk_connector.main:main"

[tool.hatch.build.targets.wheel]
packages = ["dingtalk_connector"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
